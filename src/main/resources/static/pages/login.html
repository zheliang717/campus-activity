<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>校园活动报名与场地调度系统 - 登录</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link rel="stylesheet" href="../css/style.css">
</head>
<body class="login-page">
    <div class="login-card">
        <h2><i class="bi bi-calendar-check"></i> 校园活动系统</h2>
        <p class="subtitle">活动报名与场地调度管理平台</p>

        <form id="loginForm">
            <div class="mb-3">
                <label class="form-label">用户名</label>
                <input type="text" class="form-control" id="username" placeholder="请输入用户名" required>
            </div>
            <div class="mb-3">
                <label class="form-label">密码</label>
                <input type="password" class="form-control" id="password" placeholder="请输入密码" required>
            </div>
            <div class="mb-3 form-check">
                <input type="checkbox" class="form-check-input" id="rememberMe">
                <label class="form-check-label" for="rememberMe">记住我（7天内免登录）</label>
            </div>
            <div id="loginError" class="alert alert-danger py-2 d-none"></div>
            <button type="submit" class="btn btn-primary w-100 py-2">
                <i class="bi bi-box-arrow-in-right"></i> 登录
            </button>
        </form>

        <hr class="my-4">

        <div class="text-center mb-2">
            <small class="text-muted">还没有账号？</small>
            <a href="#" class="text-decoration-none" onclick="toggleForm()">注册新账号</a>
        </div>

        <form id="registerForm" class="d-none">
            <h5 class="text-center mb-3">学生注册</h5>
            <div class="row">
                <div class="col-md-6 mb-2">
                    <label class="form-label">用户名</label>
                    <input type="text" class="form-control" id="regUsername" placeholder="登录用户名" required>
                </div>
                <div class="col-md-6 mb-2">
                    <label class="form-label">密码</label>
                    <input type="password" class="form-control" id="regPassword" placeholder="6-20位" required>
                </div>
            </div>
            <div class="row">
                <div class="col-md-6 mb-2">
                    <label class="form-label">姓名</label>
                    <input type="text" class="form-control" id="regName" placeholder="真实姓名" required>
                </div>
                <div class="col-md-6 mb-2">
                    <label class="form-label">手机号</label>
                    <input type="tel" class="form-control" id="regPhone" placeholder="联系方式">
                </div>
            </div>
            <div class="mb-3">
                <label class="form-label">邮箱</label>
                <input type="email" class="form-control" id="regEmail" placeholder="选填">
            </div>
            <div id="regError" class="alert alert-danger py-2 d-none"></div>
            <button type="submit" class="btn btn-success w-100 py-2">注册</button>
            <div class="text-center mt-2">
                <a href="#" class="text-decoration-none" onclick="toggleForm()">返回登录</a>
            </div>
        </form>

        <div class="mt-3 p-3 bg-light rounded">
            <small class="text-muted">
                <strong>测试账号：</strong><br>
                管理员：admin / admin123 &nbsp;|&nbsp; 学生：student1 / 123456
            </small>
        </div>
    </div>

    <script src="../js/common.js"></script>
    <script>
        function toggleForm() {
            document.getElementById('loginForm').classList.toggle('d-none');
            document.getElementById('registerForm').classList.toggle('d-none');
            document.getElementById('loginError').classList.add('d-none');
            document.getElementById('regError').classList.add('d-none');
        }

        // 页面加载时尝试自动登录
        (async function tryAutoLogin() {
            const saved = localStorage.getItem('campus_last_role');
            try {
                const data = await api.get(API_BASE + '/person/current');
                if (data && data.code === 200) {
                    redirectByRole(data.data.role);
                    return;
                }
            } catch(e) {}
            // 尝试cookie自动登录
            const autoData = await api.get(API_BASE + '/person/auto-login');
            if (autoData && autoData.code === 200) {
                redirectByRole(autoData.data.role);
            }
        })();

        function redirectByRole(role) {
            if (role === 'admin') window.location.href = 'admin/index.html';
            else window.location.href = 'student/index.html';
        }

        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value.trim();
            const remember = document.getElementById('rememberMe').checked;
            const errDiv = document.getElementById('loginError');
            if (!username || !password) {
                errDiv.textContent = '请填写用户名和密码';
                errDiv.classList.remove('d-none');
                return;
            }
            const data = await api.post(API_BASE + '/person/login', { username, password, remember: String(remember) });
            if (data.code === 200) {
                localStorage.setItem('campus_last_role', data.data.role);
                redirectByRole(data.data.role);
            } else {
                errDiv.textContent = data.message;
                errDiv.classList.remove('d-none');
            }
        });

        document.getElementById('registerForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const person = {
                username: document.getElementById('regUsername').value.trim(),
                password: document.getElementById('regPassword').value.trim(),
                name: document.getElementById('regName').value.trim(),
                phone: document.getElementById('regPhone').value.trim(),
                email: document.getElementById('regEmail').value.trim(),
            };
            const errDiv = document.getElementById('regError');
            if (!person.username || !person.password || !person.name) {
                errDiv.textContent = '用户名、密码、姓名为必填项';
                errDiv.classList.remove('d-none'); return;
            }
            if (person.password.length < 6) {
                errDiv.textContent = '密码至少6位';
                errDiv.classList.remove('d-none'); return;
            }
            const data = await api.post(API_BASE + '/person/register', person);
            if (data.code === 200) {
                showToast('注册成功，请登录');
                toggleForm();
                document.getElementById('username').value = person.username;
                document.getElementById('password').value = '';
            } else {
                errDiv.textContent = data.message;
                errDiv.classList.remove('d-none');
            }
        });

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                const loginVisible = !document.getElementById('loginForm').classList.contains('d-none');
                (loginVisible ? document.getElementById('loginForm') : document.getElementById('registerForm')).dispatchEvent(new Event('submit'));
            }
        });
    </script>
</body>
</html>
