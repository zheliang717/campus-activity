<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>学生 - 校园活动报名与场地调度系统</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link rel="stylesheet" href="../../css/style.css">
</head>
<body>
<div class="admin-layout">
    <nav class="sidebar">
        <div class="sidebar-header"><h4><i class="bi bi-mortarboard"></i> 学生中心</h4><small id="studentName">同学</small></div>
        <div class="sidebar-nav">
            <a class="nav-link active" data-section="dashboard" onclick="showSection('dashboard')"><i class="bi bi-house"></i><span>首页</span></a>
            <a class="nav-link" data-section="activities" onclick="showSection('activities')"><i class="bi bi-search"></i><span>浏览活动</span></a>
            <a class="nav-link" data-section="myreg" onclick="showSection('myreg')"><i class="bi bi-card-checklist"></i><span>我的报名</span></a>
            <a class="nav-link" data-section="schedule" onclick="showSection('schedule')"><i class="bi bi-calendar-week"></i><span>活动日程</span></a>
        </div>
        <div class="sidebar-footer"><button class="btn btn-outline-light btn-sm w-100" onclick="logout()"><i class="bi bi-box-arrow-right"></i><span>退出登录</span></button></div>
    </nav>

    <div class="main-content">
        <!-- 首页 -->
        <section id="section-dashboard" class="content-section active">
            <h4 class="mb-4"><i class="bi bi-house"></i> 欢迎，<span id="welcomeName"></span>！</h4>
            <div class="row">
                <div class="col-md-4 mb-3"><div class="stat-card bg-primary"><div class="stat-number" id="statTotalActivities">0</div><div class="stat-label">进行中的活动</div></div></div>
                <div class="col-md-4 mb-3"><div class="stat-card bg-success"><div class="stat-number" id="statMyReg">0</div><div class="stat-label">我的报名</div></div></div>
                <div class="col-md-4 mb-3"><div class="stat-card bg-info"><div class="stat-number" id="statAvailable">0</div><div class="stat-label">可报名活动</div></div></div>
            </div>
            <div class="card"><div class="card-header"><strong><i class="bi bi-fire"></i> 最新已通过活动</strong></div><div class="card-body" id="recentActivities"></div></div>
        </section>

        <!-- 浏览活动(分页) -->
        <section id="section-activities" class="content-section">
            <h4 class="mb-3"><i class="bi bi-search"></i> 浏览活动</h4>
            <div class="search-bar row g-2 align-items-end">
                <div class="col-md-3"><label class="form-label">活动名称</label><input type="text" class="form-control" id="sSearchName" placeholder="模糊搜索"></div>
                <div class="col-md-2"><label class="form-label">活动类型</label><select class="form-select" id="sSearchType"><option value="">全部</option><option>学术讲座</option><option>文体活动</option><option>志愿服务</option><option>其他</option></select></div>
                <div class="col-md-2"><label class="form-label">日期</label><input type="date" class="form-control" id="sSearchDate"></div>
                <div class="col-md-3"><button class="btn btn-primary me-2" onclick="loadBrowseActivities(1)"><i class="bi bi-search"></i> 查询</button><button class="btn btn-outline-secondary" onclick="document.getElementById('sSearchName').value='';document.getElementById('sSearchType').value='';document.getElementById('sSearchDate').value='';loadBrowseActivities(1);">重置</button></div>
            </div>
            <div class="row" id="activityCards"></div>
            <div id="activityCardPagination" class="mt-2"></div>
        </section>

        <!-- 我的报名(分页) -->
        <section id="section-myreg" class="content-section">
            <h4 class="mb-3"><i class="bi bi-card-checklist"></i> 我的报名记录</h4>
            <div class="card"><div class="card-body">
                <div class="fixed-table-wrap"><table class="table table-hover"><thead class="table-light"><tr><th>编号</th><th>活动名称</th><th>类型</th><th>日期</th><th>报名时间</th><th>状态</th><th>操作</th></tr></thead><tbody id="myRegTableBody"></tbody></table></div>
                <div id="myRegPagination"></div>
            </div></div>
        </section>

        <!-- 活动日程 -->
        <section id="section-schedule" class="content-section">
            <h4 class="mb-3"><i class="bi bi-calendar-week"></i> 活动日程</h4>
            <div class="search-bar row g-2 align-items-end">
                <div class="col-md-3"><label class="form-label">选择日期</label><input type="date" class="form-control" id="sScheduleDate" onchange="loadStudentSchedule()"></div>
                <div class="col-md-3"><button class="btn btn-outline-secondary" onclick="document.getElementById('sScheduleDate').value='';loadStudentSchedule();"><i class="bi bi-arrow-repeat"></i> 显示全部</button></div>
            </div>
            <div id="sScheduleContent"></div>
        </section>
    </div>
</div>

<!-- 活动详情模态框 -->
<div class="modal fade" id="activityDetailModal" tabindex="-1"><div class="modal-dialog modal-lg"><div class="modal-content">
    <div class="modal-header"><h5 class="modal-title" id="detailTitle">活动详情</h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
    <div class="modal-body" id="detailBody"></div>
    <div class="modal-footer"><button type="button" class="btn btn-secondary" data-bs-dismiss="modal">关闭</button><button type="button" class="btn btn-primary" id="detailRegisterBtn" onclick="registerActivity()">立即报名</button></div>
</div></div></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="../../js/common.js"></script>
<script>
let currentUser=null,detailModal,currentDetailId=null;
let browsePage=1,myRegPage=1;

window.addEventListener('DOMContentLoaded',async()=>{
    currentUser=await checkLogin();
    if(!currentUser||currentUser.role!=='student'){window.location.href='../login.html';return;}
    document.getElementById('studentName').textContent=currentUser.name;
    document.getElementById('welcomeName').textContent=currentUser.name;
    detailModal=new bootstrap.Modal(document.getElementById('activityDetailModal'));
    await Promise.all([loadDashboard(),loadBrowseActivities(1)]);
});

function showSection(name){
    document.querySelectorAll('.content-section').forEach(s=>s.classList.remove('active'));
    document.querySelectorAll('.sidebar-nav .nav-link').forEach(l=>l.classList.remove('active'));
    document.getElementById('section-'+name).classList.add('active');
    document.querySelector(`[data-section="${name}"]`).classList.add('active');
    if(name==='myreg')loadMyRegistrations(1);
    if(name==='schedule')loadStudentSchedule();
}

// ===== 首页 =====
async function loadDashboard(){
    const[actRes,regRes]=await Promise.all([api.get(API_BASE+'/activity/list?status=已通过'),api.get(API_BASE+'/registration/my')]);
    if(actRes.code===200){
        const acts=actRes.data;
        document.getElementById('statTotalActivities').textContent=acts.length;
        document.getElementById('statAvailable').textContent=acts.filter(a=>(a.currentParticipants||0)<(a.maxParticipants||0)).length;
        const recent=acts.slice(0,5),c=document.getElementById('recentActivities');
        if(!recent.length){c.innerHTML='<div class="empty-state"><p>暂无已通过的活动</p></div>';}
        else{c.innerHTML=recent.map(a=>`<div class="d-flex justify-content-between align-items-center border-bottom py-2"><div><strong>${escapeHtml(a.name)}</strong><small class="text-muted ms-2">${escapeHtml(a.type||'')} | ${a.activityDate||''}</small><small class="text-muted ms-2">&#x1F4CD;${escapeHtml(a.venueName||'未分配')}</small></div><button class="btn btn-sm btn-outline-primary" onclick="openDetail(${a.activityId})">查看详情</button></div>`).join('');}
    }
    if(regRes.code===200)document.getElementById('statMyReg').textContent=regRes.data.filter(r=>r.status==='已报名').length;
}

// ===== 浏览活动(分页) =====
async function loadBrowseActivities(pg){
    if(pg)browsePage=pg;
    const p=new URLSearchParams();p.append('page',browsePage);p.append('pageSize','12');p.append('status','已通过');
    const name=document.getElementById('sSearchName').value.trim(),type=document.getElementById('sSearchType').value,date=document.getElementById('sSearchDate').value;
    if(name)p.append('name',name);if(type)p.append('type',type);if(date)p.append('date',date);
    const data=await api.get(API_BASE+'/activity/page?'+p.toString());
    const container=document.getElementById('activityCards'),pgDiv=document.getElementById('activityCardPagination');
    if(data.code!==200||!data.data.records.length){container.innerHTML='<div class="col-12"><div class="empty-state"><div class="icon">&#x1F50D;</div><p>暂无符合条件的活动</p></div></div>';pgDiv.innerHTML='';return;}
    const pr=data.data;
    container.innerHTML=pr.records.map(a=>{const remaining=(a.maxParticipants||0)-(a.currentParticipants||0),full=remaining<=0;return`<div class="col-md-6 col-lg-4 mb-3"><div class="card h-100"><div class="card-body"><h5 class="card-title">${escapeHtml(a.name)}</h5><p class="mb-1"><span class="badge bg-secondary">${escapeHtml(a.type||'')}</span></p><p class="mb-1 small"><i class="bi bi-building"></i> ${escapeHtml(a.organizer||'未知')}</p><p class="mb-1 small"><i class="bi bi-calendar"></i> ${a.activityDate||''} ${a.startTime||''}-${a.endTime||''}</p><p class="mb-1 small"><i class="bi bi-geo-alt"></i> ${escapeHtml(a.venueName||'未分配')} (${escapeHtml(a.venueLocation||'')})</p><p class="mb-2 small"><i class="bi bi-people"></i> ${a.currentParticipants||0}/${a.maxParticipants||0}${full?'<span class="text-danger ms-2">已满</span>':'<span class="text-success ms-2">剩余'+remaining+'个名额</span>'}</p><p class="card-text small text-muted">${escapeHtml((a.description||'').substring(0,80))}${(a.description||'').length>80?'...':''}</p></div><div class="card-footer bg-white border-top-0"><button class="btn btn-sm btn-outline-primary w-100" onclick="openDetail(${a.activityId})"><i class="bi bi-info-circle"></i> 查看详情</button></div></div></div>`}).join('');
    pgDiv.innerHTML=renderPagination(pr.total,pr.page,pr.pageSize,loadBrowseActivities);
}

// ===== 活动详情 =====
async function openDetail(id){currentDetailId=id;const data=await api.get(API_BASE+'/activity/'+id);if(data.code!==200){showToast('获取详情失败','error');return;}const a=data.data;document.getElementById('detailTitle').textContent=a.name;const remaining=(a.maxParticipants||0)-(a.currentParticipants||0),full=remaining<=0;const checkRes=await api.get(API_BASE+'/registration/check?activityId='+id);const alreadyRegistered=checkRes.code===200&&checkRes.data===true;document.getElementById('detailBody').innerHTML=`<div class="row mb-3"><div class="col-md-6"><strong>活动类型：</strong>${escapeHtml(a.type||'')}</div><div class="col-md-6"><strong>发起单位：</strong>${escapeHtml(a.organizer||'')}</div></div><div class="row mb-3"><div class="col-md-6"><strong>活动日期：</strong>${a.activityDate||''}</div><div class="col-md-6"><strong>时间：</strong>${a.startTime||''} ~ ${a.endTime||''}</div></div><div class="row mb-3"><div class="col-md-6"><strong>场地：</strong>${escapeHtml(a.venueName||'未分配')} (${escapeHtml(a.venueLocation||'')})</div><div class="col-md-6"><strong>名额：</strong>${a.currentParticipants||0}/${a.maxParticipants||0}${full?'<span class="text-danger"> (已满)</span>':'<span class="text-success"> (剩余'+remaining+')</span>'}</div></div><div class="mb-3"><strong>活动描述：</strong><p class="mt-1">${escapeHtml(a.description||'暂无描述')}</p></div><div class="mb-3"><strong>状态：</strong>${statusBadge(a.status)}</div>`;const btn=document.getElementById('detailRegisterBtn');if(alreadyRegistered){btn.textContent='已报名';btn.className='btn btn-success';btn.disabled=true;}else if(full){btn.textContent='名额已满';btn.className='btn btn-secondary';btn.disabled=true;}else{btn.textContent='立即报名';btn.className='btn btn-primary';btn.disabled=false;}detailModal.show();}
async function registerActivity(){if(!currentDetailId)return;const data=await api.post(API_BASE+'/registration/register?activityId='+currentDetailId);if(data.code===200){showToast('报名成功！');detailModal.hide();await loadBrowseActivities(browsePage);}else{showToast(data.message,'error');}}

// ===== 我的报名(分页) =====
async function loadMyRegistrations(pg){
    if(pg)myRegPage=pg;
    const data=await api.get(API_BASE+'/registration/my/page?page='+myRegPage+'&pageSize=10');
    const tbody=document.getElementById('myRegTableBody'),pgDiv=document.getElementById('myRegPagination');
    if(data.code!==200||!data.data.records.length){tbody.innerHTML='<tr><td colspan="7" class="text-center text-muted py-4">暂无报名记录</td></tr>';pgDiv.innerHTML='';return;}
    const pr=data.data;
    tbody.innerHTML=pr.records.map((r,i)=>`<tr><td>${(pr.page-1)*pr.pageSize+i+1}</td><td><strong>${escapeHtml(r.activityName||'')}</strong></td><td>${escapeHtml(r.activityType||'')}</td><td>${r.activityDate||''}</td><td>${formatDateTime(r.regTime)}</td><td>${statusBadge(r.status)}</td><td>${r.status==='已报名'?`<button class="btn btn-sm btn-outline-danger" onclick="cancelRegistration(${r.regId})"><i class="bi bi-x-circle"></i> 取消报名</button>`:''}</td></tr>`).join('');
    pgDiv.innerHTML=renderPagination(pr.total,pr.page,pr.pageSize,loadMyRegistrations);
}
async function cancelRegistration(regId){if(!confirm('确定取消报名吗？'))return;const data=await api.post(API_BASE+'/registration/cancel/'+regId);if(data.code===200){showToast('已取消报名');await loadMyRegistrations(myRegPage);}else{showToast(data.message,'error');}}

// ===== 活动日程 =====
async function loadStudentSchedule(){const date=document.getElementById('sScheduleDate').value;const params=date?'?date='+date:'';const data=await api.get(API_BASE+'/activity/schedule'+params);const c=document.getElementById('sScheduleContent');if(data.code!==200||!data.data.length){c.innerHTML='<div class="empty-state"><div class="icon">&#x1F4C5;</div><p>暂无日程安排</p></div>';return;}let html='';data.data.forEach(g=>{html+=`<div class="schedule-venue"><h6><i class="bi bi-geo-alt-fill"></i> ${escapeHtml(g.venueName)}</h6>`;g.activities.forEach(a=>{html+=`<div class="schedule-item"><div class="schedule-time">${a.startTime||''}-${a.endTime||''}</div><div class="schedule-info"><strong>${escapeHtml(a.name)}</strong><small class="text-muted ms-2">${escapeHtml(a.type||'')} | ${escapeHtml(a.organizer||'')}</small><small class="text-muted ms-2">&#x1F4C5;${a.activityDate||''} &#x1F4CD;${escapeHtml(a.venueLocation||'')}</small><small class="text-muted ms-2">&#x1F465;${a.currentParticipants||0}/${a.maxParticipants||0}</small></div></div>`;});html+='</div>';});c.innerHTML=html;}
</script>
</body>
</html>
